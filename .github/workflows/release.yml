name: Release installers

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
            signing-link: MAC_CSC_LINK
            signing-password: MAC_CSC_KEY_PASSWORD
          - os: macos-15-intel
            platform: mac
            arch: x64
            signing-link: MAC_CSC_LINK
            signing-password: MAC_CSC_KEY_PASSWORD
          - os: windows-2025
            platform: win
            arch: x64
            signing-link: WIN_CSC_LINK
            signing-password: WIN_CSC_KEY_PASSWORD
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:reader
      - run: npm test
      - run: npm run test:gui
      - name: Build installers
        run: npm run dist -- --${{ matrix.platform }} --${{ matrix.arch }}
        env:
          CSC_LINK: ${{ secrets[matrix.signing-link] }}
          CSC_KEY_PASSWORD: ${{ secrets[matrix.signing-password] }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Check packaged application without accounts
        run: npm run test:release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/release/AI-Collab-*.dmg
            dist/release/AI-Collab-*.zip
            dist/release/AI-Collab-*.exe
            dist/release/SHA256SUMS-*.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: release-evidence-${{ matrix.platform }}-${{ matrix.arch }}
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 7

  draft-release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: installers-*
          merge-multiple: true
          path: release-artifacts
      - name: Verify artifacts and prepare draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd release-artifacts
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          test "$(find . -maxdepth 1 -name '*.dmg' | wc -l)" -eq 2
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 2
          test "$(find . -maxdepth 1 -name '*.exe' | wc -l)" -eq 1
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            node -e "if (!JSON.parse(require('fs').readFileSync('release-state.json')).isDraft) throw Error('Refusing to replace a published release.');"
            gh release upload "$RELEASE_TAG" AI-Collab-* SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" AI-Collab-* SHA256SUMS.txt --verify-tag --draft --title "AI Collab $RELEASE_TAG" --generate-notes
          fi
